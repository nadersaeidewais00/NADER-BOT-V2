<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NADER STORE - عرض قلعتك</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{background:#0f172a;color:#fff;font-family:Tahoma;padding:15px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:12px;border:1px solid #334155}
h2{color:#fbbf24;text-align:center}
h3{color:#38bdf8;margin:10px 0}
input,select{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;box-sizing:border-box}
label{font-size:13px;color:#cbd5e1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:#f59e0b;color:#000;padding:14px;width:100%;border:none;border-radius:10px;font-weight:bold;font-size:18px;margin-top:15px;cursor:pointer}
.small{font-size:11px;color:#94a3b8}
</style>
</head>
<body>
<h2>🏰 NADER STORE - عرض قلعتك للبيع</h2>
<p class="small" style="text-align:center">الارقام بالانجليزية فقط - English numbers only</p>

<div class="card">
<h3>📋 بيانات البائع</h3>
<label>اسم البائع *</label><input id="sellerName" placeholder="نادر">
<label>رقم التواصل *</label><input id="phone" type="tel" placeholder="01xxxxxxxxx" inputmode="numeric">
</div>

<div class="card">
<h3>🏰 معلومات القلعة - مستوى 1-35</h3>
<label>مستوى القلعة *</label>
<select id="level"><option value="">اختر المستوى</option></select>
<label>السعر المطلوب *</label><input id="price" type="number" placeholder="350000" inputmode="numeric">
</div>

<div class="card">
<h3>⚔️ القوى الستة</h3>
<div class="grid">
<div><label>قوة التصفير</label><input id="tasfir" type="number" value="0"></div>
<div><label>قوة التعويض</label><input id="taweed" type="number" value="0"></div>
<div><label>قوة العلوم</label><input id="oloum" type="number" value="0"></div>
<div><label>قوة الجنود</label><input id="jonoud" type="number" value="0"></div>
<div><label>شارات المجد</label><input id="majd" type="number" value="0"></div>
<div><label>قوة الاشعال</label><input id="ishal" type="number" value="0"></div>
</div>
</div>

<div class="card">
<h3>🛡️ الخصائص</h3>
<div class="grid">
<div><label>خصائص المشاة %</label><input id="k_mosah" type="number" value="0"></div>
<div><label>خصائص العجلات %</label><input id="k_ajalat" type="number" value="0"></div>
<div><label>خصائص الرماة %</label><input id="k_romah" type="number" value="0"></div>
<div><label>خصائص الرمال %</label><input id="k_remal" type="number" value="0"></div>
</div>
</div>

<div class="card">
<h3>⚔️ العتاد</h3>
<div class="grid">
<div><label>عتاد ازرق</label><input id="at_blue" type="number" value="0"></div>
<div><label>عتاد بنفسجي</label><input id="at_purple" type="number" value="0"></div>
<div><label>عتاد ذهبي</label><input id="at_gold" type="number" value="0"></div>
<div><label>عتاد اخضر</label><input id="at_green" type="number" value="0"></div>
</div>
</div>

<div class="card">
<h3>🚩 الراية</h3>
<div class="grid">
<div><label>راية المشاة %</label><input id="raya_mosah" type="number" value="0"></div>
<div><label>راية العجلات %</label><input id="raya_ajalat" type="number" value="0"></div>
</div>
</div>

<div class="card">
<h3>👑 الابطال - المشاة ثابت + الفرسان 6 ابطال + الرماة 7 ابطال</h3>
<label>المشاة - ثابت</label>
<select id="hero_mosah"><option>ثابت</option></select>

<label>الفرسان - 6 ابطال (اختر البطل والنجوم)</label>
<select id="f1_name"><option value="">اختر بطل فرسان 1</option><option>محمد الفاتح</option><option>صلاح الدين الايوبي</option><option>جوهر الصقلي</option><option>خالد بن الوليد</option><option>بيبرس</option><option>أرطغرل</option></select>
<select id="f1_stars"><option>1*</option><option>2*</option><option>3*</option><option>4*</option><option>5*</option><option selected>6*</option></select>
<select id="f2_name"><option value="">فرسان 2</option><option>محمد الفاتح</option><option>صلاح الدين الايوبي</option><option>جوهر الصقلي</option><option>حليمة خاتون</option><option>عثمان</option></select>
<select id="f2_stars"><option>1*</option><option>2*</option><option>3*</option><option>4*</option><option>5*</option><option>6*</option></select>

<label>الرماة - 7 ابطال</label>
<select id="r1_name"><option value="">اختر بطل رماة 1</option><option>حليمة خاتون</option><option>أرطغرل</option><option>محمد الفاتح</option><option>جوهر الصقلي</option><option>صلاح الدين</option></select>
<select id="r1_stars"><option>1*</option><option>2*</option><option>3*</option><option>4*</option><option>5*</option><option>6*</option><option>7*</option></select>

<select id="r2_name"><option value="">رماة 2</option><option>حليمة خاتون</option><option>أرطغرل</option><option>محمد الفاتح</option></select>
<select id="r2_stars"><option>1*</option><option>2*</option><option>3*</option><option>4*</option><option>5*</option><option>6*</option><option>7*</option></select>
</div>

<button class="btn" onclick="submitForm()">🚀 اعرض الان - NADER STORE</button>

<script>
for(let i=1;i<=35;i++){let o=document.createElement('option');o.value=i;o.textContent=i;document.getElementById('level').appendChild(o);}
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
function submitForm(){
  const data = {
    sellerName: document.getElementById('sellerName').value,
    phone: document.getElementById('phone').value,
    level: document.getElementById('level').value,
    price: document.getElementById('price').value,
    powers: { tasfir: document.getElementById('tasfir').value, taweed: document.getElementById('taweed').value, oloum: document.getElementById('oloum').value, jonoud: document.getElementById('jonoud').value, majd: document.getElementById('majd').value, ishal: document.getElementById('ishal').value },
    khasais: { mosah: document.getElementById('k_mosah').value, ajalat: document.getElementById('k_ajalat').value, romah: document.getElementById('k_romah').value, remal: document.getElementById('k_remal').value },
    atad: { blue: document.getElementById('at_blue').value, purple: document.getElementById('at_purple').value, gold: document.getElementById('at_gold').value, green: document.getElementById('at_green').value },
    raya: { mosah: document.getElementById('raya_mosah').value, ajalat: document.getElementById('raya_ajalat').value },
    heroes: [
      {name: document.getElementById('f1_name').value, stars: document.getElementById('f1_stars').value},
      {name: document.getElementById('f2_name').value, stars: document.getElementById('f2_stars').value},
      {name: document.getElementById('r1_name').value, stars: document.getElementById('r1_stars').value},
      {name: document.getElementById('r2_name').value, stars: document.getElementById('r2_stars').value}
    ].filter(h=>h.name)
  };
  if(!data.sellerName  !data.phone  !data.level || !data.price){ alert('اكمل البيانات المطلوبة *'); return; }
  tg.sendData(JSON.stringify(data));
  tg.close();
}
</script>
</body>
</html>
