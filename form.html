<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NADER STORE - اضافة قلعة</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{background:#0e1621;color:#fff;font-family:Tahoma;padding:16px;margin:0}
.card{background:#17212b;padding:16px;border-radius:14px}
h2{margin:0 0 12px;text-align:center}
label{font-size:13px;color:#aab8c2;margin-top:10px;display:block}
input,select{width:100%;padding:12px;margin:6px 0 10px;border-radius:10px;border:none;background:#0e1621;color:#fff;box-sizing:border-box;outline:1px solid #2b5278}
button{width:100%;padding:14px;background:#2b88d8;border:none;border-radius:12px;color:#fff;font-size:17px;font-weight:bold;margin-top:12px}
.hint{font-size:12px;color:#8a9ca8;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h2>🏰 اضافة اعلان قلعة</h2>

<label>مستوى القلعة</label>
<input id="level" type="number" placeholder="مثال: 25">

<label>البطل الأساسي - 21 بطل</label>
<select id="hero">
<option value="">-- اختار البطل --</option>
<option>آرثر - Arthur</option>
<option>مورغان - Morgan</option>
<option>جان دارك - Joan</option>
<option>صلاح الدين - Saladin</option>
<option>زنوبيا - Zenobia</option>
<option>سيف - Siegfried</option>
<option>لانسلوت - Lancelot</option>
<option>كليوباترا - Cleopatra</option>
<option>خالد بن الوليد</option>
<option>ليونيداس - Leonidas</option>
<option>جنكيز خان</option>
<option>نفرتيتي</option>
<option>ريتشارد قلب الأسد</option>
<option>عنترة - Antar</option>
<option>اليزابيث - Elizabeth</option>
<option>الظاهر بيبرس</option>
<option>ماري - Mary</option>
<option>عمر المختار</option>
<option>هانيبال - Hannibal</option>
<option>سليمان القانوني</option>
<option>بوديكا - Boudica</option>
</select>

<label>قوة القلعة Power</label>
<input id="power" type="number" placeholder="مثال: 15000000">

<label>السعر</label>
<input id="price" placeholder="مثال: 500 جنيه / 20$">

<label>رقم واتساب للتواصل (اختياري)</label>
<input id="whats" placeholder="مثال: 010xxxxxxxx">

<button onclick="sendData()">نشر الاعلان ✅</button>
<div class="hint">الاعلان هيظهر في المتجر فورا</div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand(); tg.MainButton.hide();
function sendData(){
  const level = document.getElementById('level').value.trim();
  const hero = document.getElementById('hero').value;
  const power = document.getElementById('power').value.trim();
  const price = document.getElementById('price').value.trim();
  const whats = document.getElementById('whats').value.trim();
  if(!level  !hero  !power || !price){ alert('كمل كل البيانات يا نادر'); return; }
  const data = {level, hero, power, price, whats};
  tg.sendData(JSON.stringify(data));
  setTimeout(()=>tg.close(), 500);
}
</script>
</body>
</html>
