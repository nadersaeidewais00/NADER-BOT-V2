<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NADER STORE</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>

function makeHeroRow(containerId, prefix, count){
  const cont=document.getElementById(containerId);

    const div=document.createElement('div'); div.className='row';
    const sel1=document.createElement('select'); sel1.id=prefix+i+"_name";

    d1.appendChild(l1); d1.appendChild(sel1); d2.appendChild(l2); d2.appendChild(sel2);
    div.appendChild(d1); div.appendChild(d2); cont.appendChild(div);
  }
}
