<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NADER STORE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{background:#0b1220;color:#fff;font-family:Tahoma;padding:12px;margin:0}
.card{background:#151e32;border:1px solid #23314f;border-radius:14px;padding:14px;margin-bottom:12px}
h2{text-align:center;color:#fbbf24;margin:8px 0}
h3{color:#38bdf8;margin:6px 0 10px;font-size:16px}
label{display:block;font-size:12px;color:#94a3b8;margin:6px 2px 2px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #2f3d5f;background:#0b1220;color:#fff;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-row{display:grid;grid-template-columns:1.7fr 0.8fr;gap:8px;align-items:end;margin-bottom:10px;background:#0b1220;border:1px solid #223151;border-radius:10px;padding:8px}
.hero-title{font-size:13px;color:#fbbf24;margin:14px 0 6px;font-weight:bold}
.btn{width:100%;background:#f59e0b;color:#000;padding:16px;border:none;border-radius:14px;font-weight:900;font-size:18px;margin-top:10px}
.note{color:#64748b;font-size:11px;text-align:center}
</style>
</head>
<body>
<h2>🏰 NADER STORE - عرض قلعتك</h2>

<div class="card">
<h3>بيانات البائع</h3>
<label>اسم البائع *</label><input id="sellerName" placeholder="نادر">
<label>رقم التواصل *</label><input id="phone" type="tel" placeholder="010xxxxxxxx">
</div>

<div class="card">
<h3>معلومات القلعة - مستوى 1-35</h3>
<label>مستوى القلعة *</label><select id="level"><option value="">اختر المستوى 1-35</option></select>
<label>السعر المطلوب *</label><input id="price" type="number" placeholder="350000">
</div>

<div class="card">
<h3>قوة القلعة</h3>
<div class="row2">
<div><label>قوة التصفير</label><input id="tasfir" type="number" value="0"></div>
<div><label>قوة التعويض</label><input id="taweed" type="number" value="0"></div>
<div><label>قوة العلوم</label><input id="oloum" type="number" value="0"></div>
<div><label>قوة الجنود</label><input id="jonoud" type="number" value="0"></div>
<div><label>شارات المجد</label><input id="majd" type="number" value="0"></div>
<div><label>قوة الاشعال</label><input id="ishal" type="number" value="0"></div>
</div>
</div>

<div class="card">
<h3>العتاد</h3>
<div class="row2">
<div><label>عتاد اخضر</label><input id="at_green" type="number" value="0"></div>
<div><label>عتاد ازرق</label><input id="at_blue" type="number" value="0"></div>
<div><label>عتاد بنفسجي</label><input id="at_purple" type="number" value="0"></div>
<div><label>عتاد ذهبي</label><input id="at_gold" type="number" value="0"></div>
</div>
</div>

<div class="card">
<h3>الراية - حيوية</h3>
<div class="row2">
<div><label>حيوية المشاة %</label><input id="hay_mosah" type="number" value="0"></div>
<div><label>حيوية العجلات %</label><input id="hay_ajalat" type="number" value="0"></div>
</div>
</div>

<div class="card">
<h3>👑 الابطال - كل بطل قدامه عدد النجوم</h3>

<div class="hero-title">المشاة - ثابت</div>
<div class="hero-row">
<div><label>البطل</label><select><option>ثابت</option></select></div>
<div><label>النجوم</label><select><option>ثابت</option></select></div>
</div>

<div class="hero-title">الفرسان - 6 ابطال</div>

<div class="hero-row"><div><label>فرسان 1</label><select id="f1_name"><option value="">اختر البطل</option><option>محمد الفاتح</option><option>محمد الثاني</option><option>صلاح الدين الايوبي</option><option>جوهر الصقلي</option><option>عمر المختار</option><option>خالد بن الوليد</option><option>بيبرس</option><option>أرطغرل</option><option>عثمان</option></select></div><div><label>النجوم</label><select id="f1_star"><option value="">النجوم</option><option>1 نجمة</option><option>2 نجمة</option><option>3 نجوم</option><option>4 نجوم</option><option>5 نجوم</option><option>6 نجوم</option><option>7 نجوم</option></select></div></div>
<div class="hero-row"><div><label>رماة 4</label><select id="r4_name"><option value="">اختر البطل</option><option>حليمة خاتون</option></select></div><div><label>النجوم</label><select id="r4_star"><option value="">النجوم</option><option>1 نجمة</option><option>2 نجمة</option><option>3 نجوم</option><option>4 نجوم</option><option>5 نجوم</option><option>6 نجوم</option><option>7 نجوم</option></select></div></div>

<div class="hero-row"><div><label>رماة 5</label><select id="r5_name"><option value="">اختر البطل</option><option>حليمة خاتون</option></select></div><div><label>النجوم</label><select id="r5_star"><option value="">النجوم</option><option>1 نجمة</option><option>2 نجمة</option><option>3 نجوم</option><option>4 نجوم</option><option>5 نجوم</option><option>6 نجوم</option><option>7 نجوم</option></select></div></div>

<div class="hero-row"><div><label>رماة 6</label><select id="r6_name"><option value="">اختر البطل</option><option>حليمة خاتون</option></select></div><div><label>النجوم</label><select id="r6_star"><option value="">النجوم</option><option>1 نجمة</option><option>2 نجمة</option><option>3 نجوم</option><option>4 نجوم</option><option>5 نجوم</option><option>6 نجوم</option><option>7 نجوم</option></select></div></div>

<div class="hero-row"><div><label>رماة 7</label><select id="r7_name"><option value="">اختر البطل</option><option>حليمة خاتون</option></select></div><div><label>النجوم</label><select id="r7_star"><option value="">النجوم</option><option>1 نجمة</option><option>2 نجمة</option><option>3 نجوم</option><option>4 نجوم</option><option>5 نجوم</option><option>6 نجوم</option><option>7 نجوم</option></select></div></div>

</div>

<button class="btn" onclick="send()">اعرض الان - NADER STORE</button>
<p class="note">الارقام بالانجليزية فقط</p>

<script>
for(let i=1;i<=35;i++){let o=document.createElement('option');o.value=i;o.textContent=i;document.getElementById('level').appendChild(o);}
const tg=window.Telegram.WebApp; tg.ready(); tg.expand();
function send(){
  function get(id){return document.getElementById(id)?.value||""}
  const forsan=[], romah=[];
  for(let i=1;i<=6;i++){const n=get('f'+i+'_name'), s=get('f'+i+'_star'); if(n) forsan.push({name:n,stars:s});}
  for(let i=1;i<=7;i++){const n=get('r'+i+'_name'), s=get('r'+i+'_star'); if(n) romah.push({name:n,stars:s});}
  const data={sellerName:get('sellerName'),phone:get('phone'),level:get('level'),price:get('price'),powers:{tasfir:get('tasfir'),taweed:get('taweed'),oloum:get('oloum'),jonoud:get('jonoud'),majd:get('majd'),ishal:get('ishal')},atad:{green:get('at_green'),blue:get('at_blue'),purple:get('at_purple'),gold:get('at_gold')},hayawia:{mosah:get('hay_mosah'),ajalat:get('hay_ajalat')},forsan,romah};
  if(!data.sellerName!data.phone!data.level||!data.price){alert('اكمل البيانات *');return;}
  tg.sendData(JSON.stringify(data)); tg.close();
}
</script>
</body>
</html>
